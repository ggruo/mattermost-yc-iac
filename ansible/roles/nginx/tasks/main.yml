---
- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name: [nginx, certbot]
    state: present

- name: Prepare ACME webroot
  ansible.builtin.file:
    path: /var/www/acme
    state: directory
    mode: '0755'

- name: Check existing certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_fqdn }}/fullchain.pem"
  register: certificate

- name: Install HTTP bootstrap only before first certificate
  ansible.builtin.template:
    src: http.conf.j2
    dest: /etc/nginx/sites-available/notes
    mode: '0644'
  when: not certificate.stat.exists
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/notes
    dest: /etc/nginx/sites-enabled/notes
    state: link
  notify: Reload nginx

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Start Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Apply HTTP configuration before requesting certificate
  ansible.builtin.meta: flush_handlers

- name: Obtain certificate through webroot without rewriting Nginx configuration
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - -w
      - /var/www/acme
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ letsencrypt_email }}"
      - -d
      - "{{ app_fqdn }}"
    creates: "/etc/letsencrypt/live/{{ app_fqdn }}/fullchain.pem"

- name: Install HTTPS configuration
  ansible.builtin.template:
    src: https.conf.j2
    dest: /etc/nginx/sites-available/notes
    mode: '0644'
  notify: Reload nginx

- name: Reload Nginx after certificate renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
    content: "#!/bin/sh\n/usr/sbin/nginx -t && /bin/systemctl reload nginx\n"
    mode: '0755'

- name: Enable renewal timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
