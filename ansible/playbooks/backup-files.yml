---
- name: Back up Mattermost local files
  hosts: mattermost
  become: true
  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ mattermost_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Create Mattermost file backup archive
      ansible.builtin.archive:
        path:
          - "{{ mattermost_install_dir }}/config"
          - "{{ mattermost_install_dir }}/data"
          - "{{ mattermost_install_dir }}/plugins"
          - "{{ mattermost_install_dir }}/client/plugins"
        dest: "{{ mattermost_backup_dir }}/mattermost-files-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        format: gz
        owner: root
        group: root
        mode: "0600"
